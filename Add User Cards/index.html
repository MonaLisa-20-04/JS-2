<!DOCTYPE html>

  <title>User Cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

<body class="min-h-screen bg-[#0f0f0f] text-neutral-200 flex flex-col items-center gap-10 px-4 py-8">

  <!-- Add User form -->
  <form autocomplete="off" class=" w-full max-w-[480px] bg-[#262626] border border-neutral-600 rounded-2xl p-7 shadow-lg">
    <h1 class="text-center text-3xl font-bold text-neutral-200 mb-6">Add User</h1>

    <div class="mb-5">
      <label for="name" class="block text-sm font-semibold mb-2">Name</label>
      <input id="name" type="text"
        class="w-full h-10 rounded-lg bg-[#333] border border-neutral-700 px-3 text-neutral-100 outline-none focus:border-neutral-400" />
    </div>

    <div class="mb-5">
      <label for="role" class="block text-sm font-semibold mb-2">Role</label>
      <input id="role" type="text"
        class="w-full h-10 rounded-lg bg-[#333] border border-neutral-700 px-3 text-neutral-100 outline-none focus:border-neutral-400" />
    </div>

    <div class="mb-5">
      <label for="bio" class="block text-sm font-semibold mb-2">Bio</label>
      <textarea id="bio"
        class="w-full h-24 rounded-lg bg-[#333] border border-neutral-700 px-3 py-2 text-neutral-100 outline-none focus:border-neutral-400 resize-y"></textarea>
    </div>

    <div class="mb-6">
      <label for="photo" class="block text-sm font-semibold mb-2">Photo URL</label>
      <input id="photo" type="text"
        class="w-full h-10 rounded-lg bg-[#333] border border-neutral-700 px-3 text-neutral-100 outline-none focus:border-neutral-400" />
    </div>

    <button type="submit"
      class="w-full h-12 rounded-lg border border-neutral-700 bg-transparent text-sm font-semibold text-neutral-200 hover:bg-neutral-800 transition">
      Submit
    </button>
  </form>
