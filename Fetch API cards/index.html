
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <!-- Main container -->
    <div class="min-h-screen bg-[#0f172a] flex flex-col items-center justify-center p-6 gap-6 font-sans antialiased">

        <!-- Cards container -->
        <div class="users flex items-center justify-center flex-wrap gap-4 w-full">
        </div>

        <!-- Refresh button -->
        <button
           class="refreshbtn flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-500 active:scale-95 transition rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400">

            <svg xmlns="http://www.w3.org/2000/svg"
                 class="w-4 h-4"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor"
                 stroke-width="2">

                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M4 4v5h5M20 20v-5h-5M5.6 15A8 8 0 0018.4 9M18.4 9L20 9M5.6 15L4 15" />
            </svg>

            Refresh
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
